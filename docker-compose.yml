services:
  hrmv2:
    build: .
    container_name: hrmv2-pulsa
    restart: unless-stopped
    ports:
      - "5000:5000"
    volumes:
      # Data & Berkas Upload Persisten - Terlihat & Mudah Di-backup dari Files ZimaOS
      - ./data:/app/data
    environment:
      - NODE_ENV=production
      - PORT=5000
      - DATA_DIR=/app/data
